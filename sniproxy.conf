# Egress allowlist for the agent jails. Installed by sniproxy-setup.sh.
# sniproxy connects to the name in the SNI, so a forged one reaches only that host.

user nobody
pidfile /var/run/sniproxy.pid

error_log {
	syslog daemon
	priority notice
}

access_log {
	filename /var/log/sniproxy.log
	priority notice
}

# For sniproxy's own backend lookups. No IPv6 route on the bridges.
resolver {
	nameserver 172.16.0.1
	mode ipv4_only
}

# One address per jail, so the two never share an allowlist. .2 is an alias.
listen 172.16.1.1:443 {
	proto tls
	table claude
}

listen 172.16.1.1:80 {
	proto http
	table claude
}

listen 172.16.1.2:443 {
	proto tls
	table codex
}

listen 172.16.1.2:80 {
	proto http
	table codex
}

# Target * is the requested name, on the listener's port. No fallback, so a miss is refused.
table claude {
	^([a-z0-9-]+\.)*anthropic\.com$		*
	^([a-z0-9-]+\.)*claude\.com$		*
	^([a-z0-9-]+\.)*claude\.ai$		*

	^github\.com$				*
	^api\.github\.com$			*
	^codeload\.github\.com$			*
	^objects\.githubusercontent\.com$	*
	^raw\.githubusercontent\.com$		*

	^([a-z0-9-]+\.)*freebsd\.org$		*

	^registry\.npmjs\.org$			*
	^crates\.io$				*
	^(static|index)\.crates\.io$		*
	^pypi\.org$				*
	^files\.pythonhosted\.org$		*
}

# Same infrastructure, different vendor. sniproxy has no include, so it repeats.
table codex {
	^([a-z0-9-]+\.)*openai\.com$		*
	^([a-z0-9-]+\.)*chatgpt\.com$		*

	^github\.com$				*
	^api\.github\.com$			*
	^codeload\.github\.com$			*
	^objects\.githubusercontent\.com$	*
	^raw\.githubusercontent\.com$		*

	^([a-z0-9-]+\.)*freebsd\.org$		*

	^registry\.npmjs\.org$			*
	^crates\.io$				*
	^(static|index)\.crates\.io$		*
	^pypi\.org$				*
	^files\.pythonhosted\.org$		*
}
